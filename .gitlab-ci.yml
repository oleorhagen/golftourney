stages:
  - build
  - test
  - release
  - deploy


.build:orhagen-websites:
  stage: build
  image: docker:20.10
  services:
    - docker:20.10-dind
  before_script:
    - docker info
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build  --tag "$CI_REGISTRY_IMAGE/$WEBSITE_NAME:latest" $WEBSITE_NAME
    - docker push "$CI_REGISTRY_IMAGE/$WEBSITE_NAME:latest"

build:orhagen-member:
  extends: .build:orhagen-websites
  only:
    changes:
      - ui/*
      - ui/**/*
  variables:
    WEBSITE_NAME: "skjeberg-inv"
    NODE_OPTIONS: "--openssl-legacy-provider"
