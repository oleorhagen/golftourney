version: '3.8'
# volumes:
#   golfdata:

services:

  gateway:
    image: traefik
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:7374/healthy || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: bitnami/postgresql:latest
    container_name: golf-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: golf_db
    healthcheck:
      test: pg_isready --user=postgres --dbname=golf_db
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./sql:/docker-entrypoint-initdb.d/


  postgraphile:
    image: graphile/postgraphile
    container_name: postgraphile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5433:5433"
    command:
      [
        '--connection',
        'postgres://postgres:password@db:5432/golf_db',
        '--port',
        '5433',
        '--schema',
        'physical',
        '--enhance-graphiql',
        '--watch',
        '--subscriptions',
        '--live',
        '--dynamic-json',
        '--show-error-stack=json',
        '--extended-errors',
        'hint,detail,errcode',
        '--no-setof-functions-contain-nulls',
        '--export-schema-graphql',
        '/tmp/schema.graphql',
      ]

